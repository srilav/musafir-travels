name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches-ignore:
      - main # main is covered by deploy.yml, which calls this workflow
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: musafir
          POSTGRES_PASSWORD: musafir
          POSTGRES_DB: musafir_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U musafir -d musafir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+psycopg://musafir:musafir@localhost:5433/musafir_test
      # AI is exercised with a mocked provider; no Anthropic key in CI.
      AI_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
