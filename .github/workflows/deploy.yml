name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {} # e.g. after a restore, when ECR is empty

permissions:
  contents: read

# Never run two deploys at once; don't cancel one mid-migration.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    name: Build, migrate & deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS deploy role (no static keys)

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'musafir-backend' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'musafir-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'musafir-api' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'musafir-api' }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'api' }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: musafir-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" -f backend/Dockerfile backend
          docker push "$IMAGE"
          # :latest keeps Terraform's own task-definition revision resolvable.
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register task definition with new image
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # Latest ACTIVE revision of the family = Terraform's config (env, secrets,
          # roles) or the previous deploy's; only the image is swapped.
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition --output json > current.json
          jq --arg IMAGE "$IMAGE" --arg NAME "$ECS_CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current.json > new.json
          if ! jq -e --arg NAME "$ECS_CONTAINER_NAME" '.containerDefinitions[] | select(.name == $NAME)' new.json > /dev/null; then
            echo "::error::Container '$ECS_CONTAINER_NAME' not found in task family '$ECS_TASK_FAMILY'"
            exit 1
          fi
          ARN=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Resolve network configuration
        id: net
        run: |
          set -euo pipefail
          SUBNETS="$ECS_SUBNETS"
          SG="$ECS_SECURITY_GROUP"
          if [ -z "$SUBNETS" ] || [ -z "$SG" ]; then
            echo "ECS_SUBNETS/ECS_SECURITY_GROUP not set; reading from the ECS service"
            NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
            if [ -z "$SUBNETS" ]; then SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")'); fi
            if [ -z "$SG" ]; then SG=$(echo "$NET" | jq -r '.securityGroups[0]'); fi
          fi
          if [ -z "$SUBNETS" ] || [ -z "$SG" ] || [ "$SG" = "null" ]; then
            echo "::error::Could not determine subnets/security group for the migration task"
            exit 1
          fi
          jq -nc --arg s "$SUBNETS" --arg g "$SG" \
            '{awsvpcConfiguration:{subnets:($s|split(",")),securityGroups:[$g],assignPublicIp:"DISABLED"}}' > network.json
          cat network.json

      - name: Run database migrations and load AI reference knowledge
        env:
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          OVERRIDES=$(jq -nc --arg NAME "$ECS_CONTAINER_NAME" \
            '{containerOverrides:[{name:$NAME,command:["sh","-c","alembic upgrade head && python -m scripts.load_knowledge"]}]}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration file://network.json \
            --overrides "$OVERRIDES" \
            --started-by "gha-migrate-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to start migration task"
            exit 1
          fi
          echo "Migration task: $TASK_ARN"

          # tasks-stopped waiter gives up after ~10 min; retry a couple of times.
          for i in 1 2 3; do
            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" && break
            echo "Waiter attempt $i timed out; still waiting..."
          done

          DESC=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --output json)
          LAST_STATUS=$(echo "$DESC" | jq -r '.tasks[0].lastStatus')
          EXIT_CODE=$(echo "$DESC" | jq -r --arg NAME "$ECS_CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $NAME) | .exitCode // "none"')
          REASON=$(echo "$DESC" | jq -r '.tasks[0].stoppedReason // ""')

          # Show migration logs (awslogs stream: ecs/<container>/<task-id>).
          LOG_GROUP=$(jq -r --arg NAME "$ECS_CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $NAME) | .logConfiguration.options["awslogs-group"] // empty' new.json)
          PREFIX=$(jq -r --arg NAME "$ECS_CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $NAME) | .logConfiguration.options["awslogs-stream-prefix"] // empty' new.json)
          if [ -n "$LOG_GROUP" ] && [ -n "$PREFIX" ]; then
            echo "---- migration logs ----"
            aws logs get-log-events --log-group-name "$LOG_GROUP" \
              --log-stream-name "$PREFIX/$ECS_CONTAINER_NAME/${TASK_ARN##*/}" \
              --start-from-head --query 'events[].message' --output text || echo "(logs unavailable)"
            echo "------------------------"
          fi

          echo "lastStatus=$LAST_STATUS exitCode=$EXIT_CODE stoppedReason=$REASON"
          if [ "$LAST_STATUS" != "STOPPED" ] || [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed (status=$LAST_STATUS, exit=$EXIT_CODE). Service NOT updated."
            exit 1
          fi

      - name: Update ECS service
        env:
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" --query 'service.serviceArn' --output text

      - name: Wait for service stability
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" && exit 0
            echo "Waiter attempt $i timed out; still waiting..."
          done
          echo "::error::Service did not stabilize"
          exit 1

      - name: Verify running task definition
        env:
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          RUNNING=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          echo "Primary deployment: $RUNNING"
          if [ "$RUNNING" != "$TASK_DEF_ARN" ]; then
            echo "::error::Deployment was rolled back (circuit breaker). Expected $TASK_DEF_ARN"
            exit 1
          fi
