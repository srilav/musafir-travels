services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: musafir
      POSTGRES_PASSWORD: musafir
      POSTGRES_DB: musafir
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musafir -d musafir"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://musafir:musafir@db:5432/musafir
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.load_knowledge && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
